<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1 class="logo">Notes App</h1>
            <div class="nav-menu">
                <a href="#" class="nav-item active">
                    <i class="fa-regular fa-file-lines"></i> Notes
                </a>
            </div>
            <div class="user-info">
                <p><strong>Reynard Adimas N.</strong></p>
                <p>123230079</p>
                <p>Prak TCC IF-B</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Form Section -->
            <div class="form-container">
                <div class="form-card">
                    <div class="form-header">
                        <h2 id="form-title">Add a Note</h2>
                        <!-- Tombol untuk versi Desktop -->
                         <!-- <button class="btn btn-cancel" id="btn-cancel" style="display:none;">Cancel</button> -->
                        <button class="btn btn-desktop" id="btn-submit-desktop">Add</button>
                    </div>
                    <div class="form-inputs">
                        <input type="text" placeholder="Title" class="input-title" id="input-title">
                        <textarea placeholder="Take a note..." class="input-body" id="input-body"></textarea>
                    </div>
                </div>
                <!-- Tombol untuk versi Mobile -->
                <!-- <button class="btn btn-mobile" id="btn-submit-mobile">Cancel</button> -->
                <button class="btn btn-mobile" id="btn-submit-mobile">Add</button>
            </div>

            <!-- Notes List Section -->
            <div class="notes-section">
                <div class="section-title">
                    <i class="fa-regular fa-file-lines"></i>
                    <h3>My Notes</h3>
                </div>
                <p class="subtitle">Recently viewed</p>
                
                <div class="notes-grid">
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
